description: Style the Hermes Desktop session list — per-conversation icons, status marks, colors and sizes, mirrored to the profile so a new machine restores them.
author: Emad Al-Saba
license: MIT
homepage: https://github.com/emadalsaba/hermes-session-styler
desktop:
